name: Publicar blog desde Notion

# Cada dos horas, y con botón manual en la pestaña Actions.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traer las entradas desde Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 blog/sincronizar.py

      # Las portadas llevan la foto y el logo embebidos en base64, así que
      # Chrome las arma desde un archivo suelto: sin servidor local.
      - name: Generar portadas
        run: python3 blog/portadas.py

      - name: Generar el HTML
        run: python3 blog/generar.py

      - name: Publicar si algo cambió
        run: |
          git config user.name  "freaknerd bot"
          git config user.email "contacto@freaknerd.co"
          git add blog sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios: nada que publicar."
          else
            git commit -m "Blog: sincroniza desde Notion"
            git push
          fi
